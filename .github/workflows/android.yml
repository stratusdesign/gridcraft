# GridCraft as an Android app (.apk) — runs on Android and natively on ChromeOS.
# Builds arm64 (most phones, ARM Chromebooks) and x86_64 (Intel/AMD Chromebooks) in one APK.
name: Android

on:
  push:
    branches: [android]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-apk
        run: cargo install cargo-apk --locked
      - name: Build APK
        working-directory: apps/gridcraft-android
        run: |
          export ANDROID_HOME="$ANDROID_SDK_ROOT"
          export ANDROID_NDK_ROOT="$ANDROID_NDK_LATEST_HOME"
          cargo apk build --release
      - uses: actions/upload-artifact@v4
        with:
          name: gridcraft-android-apk
          path: target/release/apk/*.apk
          if-no-files-found: error
