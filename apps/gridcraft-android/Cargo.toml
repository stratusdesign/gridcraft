[package]
name = "gridcraft-android"
description = "GridCraft as an Android app (runs on Android phones/tablets and ChromeOS)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

# Built with `cargo ndk` into android/app/src/main/jniLibs, then packaged by Gradle
# (android/), which adds the Java activity the system file picker needs.
[lib]
crate-type = ["cdylib"]

[target.'cfg(target_os = "android")'.dependencies]
gridcraft-engine = { workspace = true }
gridcraft-ui-egui = { workspace = true }
eframe = { workspace = true, features = ["default_fonts", "wgpu", "android-native-activity"] }
egui = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }
android_logger = "0.15"
winit = { version = "0.30", default-features = false, features = ["android-native-activity"] }
jni = "0.21"
ndk-context = "0.1"
